version: "3.9"
services:
  dashboard:
    build: ./dashboard
    ports:
      - "8502:8502"
    volumes:
      - ./data:/app/data:ro
    environment:
      - STREAMLIT_SERVER_PORT=8502
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4173:80"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  misdata:
    driver: local
    driver_opts:
      type: cifs
      o: "username=Sane Alam,password=wildnet,iocharset=utf8,file_mode=0644,dir_mode=0755,vers=3.0,sec=ntlmssp,noperm"
      device: "//172.16.16.230/Users/Sane Alam/Documents/MIS_DATA"
